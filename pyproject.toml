[project]
name = "toxic-service"
version = "0.1.0"
description = "Production service for toxic comment classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "asyncpg>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "locust>=2.31.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toxic_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]