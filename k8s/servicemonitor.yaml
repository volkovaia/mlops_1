apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: toxic-service-monitor
  namespace: monitoring
  labels:
    release: prometheus
    app: toxic-service
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: toxic-service
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s