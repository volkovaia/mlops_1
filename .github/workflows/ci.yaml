name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: toxic_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/toxic_db
        run: uv run pytest -v

  build:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          node_image: kindest/node:v1.30.2
          cluster_name: kind-ci

      - name: Set up GHCR pull secret in cluster
        run: |
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl patch serviceaccount default -p '{"imagePullSecrets": [{"name": "ghcr-auth"}]}'

      - name: Deploy Postgres in cluster
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=90s

      - name: Prepare manifests with dynamic values
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          DB_PASS="${{ secrets.DB_PASSWORD || 'postgrespassword' }}"
          sed -i "s|postgres:postgres|postgres:${DB_PASS}|g" k8s/secret.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/toxic-service --timeout=120s

      - name: Run Smoke Test with semantic assertion and DB check
        run: |
          kubectl port-forward svc/toxic-service 8080:8000 &
          sleep 4

          echo "Checking /health endpoint"
          curl --fail -s http://localhost:8080/health \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['status'] == 'ok' and 'model_path' in r, r; print('Health check PASSED:', r)"

          cat << 'EOF' > good.json
          {"comment_text": "This is a comment"}
          EOF

          echo "Checking /v1/predict..."
          PRED_RESP=$(curl --fail -s -X POST http://localhost:8080/v1/predict \
            -H "Content-Type: application/json" \
            -d @good.json)
          echo "Response: $PRED_RESP"
          REQ_ID=$(echo "$PRED_RESP" | python3 -c "import json, sys; r = json.load(sys.stdin); assert 0.0 <= r['probability'] <= 1.0; print(r['request_id'])")

          sleep 2
          echo "Checking row in Postgres table for request_id $REQ_ID..."
          kubectl exec deploy/postgres -- psql -U postgres -d toxic_db -c \
            "SELECT request_id, status_code, latency_ms, prediction FROM prediction_logs WHERE request_id = '$REQ_ID';" \
            | grep "$REQ_ID"
          echo "Smoke & DB check PASSED successfully!"

      - name: Rich diagnostics on failure
        if: failure()
        run: |
          echo  "KUBECTL GET ALL"
          kubectl get all -o wide || true
          echo  "DESCRIBE PODS"
          kubectl describe pods || true
          echo "CONTAINER LOGS"
          kubectl logs -l app=toxic-service --all-containers --tail=100 || true
          echo "CLUSTER EVENTS"
          kubectl get events --sort-by='.metadata.creationTimestamp' || true