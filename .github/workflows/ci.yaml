name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: toxic_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/toxic_db
        run: uv run pytest -v

  build:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kind]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GHCR pull secret in cluster
        run: |
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -p '{"imagePullSecrets": [{"name": "ghcr-auth"}]}'

      - name: Deploy Postgres in cluster
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=90s

      - name: Create or update Secret safely
        run: |
          DB_PASS="${{ secrets.DB_PASSWORD || 'postgrespassword' }}"
          kubectl create secret generic toxic-secret \
            --from-literal=DATABASE_URL="postgresql://postgres:${DB_PASS}@postgres:5432/toxic_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare manifests with dynamic values
        run: |
          sed -i "s|image: toxic-service:latest|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/toxic-service --timeout=240s

      - name: Run Smoke Test via Ingress
        run: |
          sleep 5

          echo "1. Checking /health (model version from registry)..."
          curl --fail -sS -H "Host: toxic.localhost" http://mlpro-cluster-control-plane/health \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['status'] == 'ok' and r['model_version'] != 'local', r; print('Health check PASSED:', r)"

          echo "2. Checking /v1/predict with semantic assertion"
          cat << 'EOF' > good.json
          {"comment_text": "This is a great and helpful neutral comment"}
          EOF

          PRED_RESP=$(curl --fail -sS -X POST http://mlpro-cluster-control-plane/v1/predict \
            -H "Host: toxic.localhost" \
            -H "Content-Type: application/json" \
            -d @good.json)
          echo "Predict response: $PRED_RESP"
          
          REQ_ID=$(echo "$PRED_RESP" | python3 -c "import json, sys; r = json.load(sys.stdin); assert 0.0 <= r['probability'] <= 1.0; print(r['request_id'])")

          sleep 2
          echo "3. Verifying record in Postgres logs table for request_id $REQ_ID"
          kubectl exec deploy/postgres -- psql -U postgres -d toxic_db -c \
            "SELECT request_id, status_code, latency_ms, prediction FROM prediction_logs WHERE request_id = '$REQ_ID';" \
            | grep "$REQ_ID"
          echo "Smoke test PASSED on all 3 conditions!"

      - name: Rich diagnostics on failure
        if: failure()
        run: |
          echo "KUBECTL GET ALL"
          kubectl get all -o wide || true
          echo "DESCRIBE PODS"
          kubectl describe pods || true
          echo "CONTAINER LOGS"
          kubectl logs -l app=toxic-service --all-containers --tail=100 || true
          echo "CLUSTER EVENTS"
          kubectl get events --sort-by='.metadata.creationTimestamp' || true
